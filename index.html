<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Portfólio de Pedro Hasse Niemczewski — desenvolvedor de software fullstack (TypeScript, React, C#/.NET). Projetos, experiência e currículo."
    />
    <title>Pedro Hasse Niemczewski — Desenvolvedor de Software</title>
    <script>
      // Aplica o tema antes do render pra não piscar (FOUC).
      ;(function () {
        try {
          var t = localStorage.getItem('tema')
          var escuro = t
            ? t === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (escuro) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
